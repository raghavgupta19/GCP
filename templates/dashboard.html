<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Run System Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>Cloud Run System Dashboard</h1>
    <p id="timestamp">Loading...</p>
</header>

<section class="grid">
    <div class="card">
        <h2>CPU</h2>
        <p><strong>Usage:</strong> <span id="cpu"></span>%</p>
        <p class="source">/proc/stat</p>
    </div>

    <div class="card">
        <h2>Memory</h2>
        <p><strong>Used:</strong> <span id="mem_used"></span> KB</p>
        <p><strong>Available:</strong> <span id="mem_avail"></span> KB</p>
        <p><strong>Usage:</strong> <span id="mem_percent"></span>%</p>
        <p class="source">/proc/meminfo</p>
    </div>

    <div class="card">
        <h2>Process</h2>
        <p><strong>PID:</strong> <span id="pid"></span></p>
        <p><strong>CPU Ticks:</strong> <span id="cpu_ticks"></span></p>
        <p><strong>Memory Pages:</strong> <span id="pages"></span></p>
        <p class="source">/proc/self/stat</p>
    </div>

    <div class="card health">
        <h2>Health</h2>
        <p id="health_status"></p>
        <p><strong>Score:</strong> <span id="health_score"></span>/100</p>
    </div>
</section>

<script>
async function loadData() {
    const res = await fetch("/analyze");
    const data = await res.json();

    document.getElementById("timestamp").innerText =
        "Last Updated: " + data.meta.timestamp;

    document.getElementById("cpu").innerText = data.cpu.usage_percent;

    document.getElementById("mem_used").innerText = data.memory.used_kb;
    document.getElementById("mem_avail").innerText = data.memory.available_kb;
    document.getElementById("mem_percent").innerText = data.memory.used_percent;

    document.getElementById("pid").innerText = data.process.pid;
    document.getElementById("cpu_ticks").innerText = data.process.cpu_time_ticks;
    document.getElementById("pages").innerText = data.process.memory_pages;

    document.getElementById("health_status").innerText = data.health.status;
    document.getElementById("health_score").innerText = data.health.score;

    const healthCard = document.querySelector(".health");
    healthCard.className = "card health " + data.health.status.toLowerCase();
}

loadData();
setInterval(loadData, 5000);
</script>

</body>
</html>
